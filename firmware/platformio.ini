; LilyGO T3-S3 SX1262 — LoRa power-meter link firmware
;
; ONE image for both boards. The role (basement meter node / flat gateway) is
; chosen once in the setup web UI and stored in NVS, so the same .bin can be
; flashed to either board and handed over without a build step.
;
; env:native builds the hardware-independent core library on the host, so the
; SML parser, the packet codec and the legal duty-cycle accounting are unit
; tested without a board attached.

[platformio]
default_envs = t3s3
boards_dir = boards

[t3s3]
platform = espressif32@6.13.0
framework = arduino
board = lilygo_t3s3
upload_speed = 921600
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
; Never touch DTR/RTS when the monitor opens the port. This board talks over the
; ESP32-S3's built-in USB-Serial/JTAG, where asserting them RESETS the chip: a
; board being watched restarted on every open, reprinted its boot log and showed
; the BOOT hint on the OLED - a healthy board looking like it was stuck in boot,
; and off the network while it rejoined.
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    jgromes/RadioLib@^7.1.2
    olikraus/U8g2@^2.35.19
    ; MQTT is what lets the device announce itself to Home Assistant - REST has
    ; no discovery, so it always needs a package file copied in.
    knolleary/PubSubClient@^2.8
build_flags =
    -DCORE_DEBUG_LEVEL=3
; ARDUINO_USB_MODE / ARDUINO_USB_CDC_ON_BOOT live in boards/lilygo_t3s3.json:
; they are properties of the board, and without them Serial stays on UART0 and
; GPIO43/44 (the only free pins) cannot be used for the meter IR read head.
board_build.partitions = partitions/lilygo_4mb_ota.csv

[env:t3s3]
extends = t3s3
extra_scripts = pre:../tools/gen_version.py

[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DCORE_NATIVE=1
    ; Unity needs this for TEST_ASSERT_DOUBLE_* (energy values are compared as
    ; doubles); without it every double assertion fails at runtime.
    -DUNITY_INCLUDE_DOUBLE
test_build_src = no
