name: CI/CD

# Every push and pull request: unit tests, the integration check, and a firmware
# build whose images are attached to the run as a downloadable artifact.
#
# A tag v<VERSION> (e.g. v0.2.0) additionally publishes a GitHub Release with
# the images and deploys the browser flasher to GitHub Pages. How to cut a
# release: docs/FLASHING.md, section "Publishing a release".

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: host unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Run the hardware-free core tests
        working-directory: firmware
        run: pio test -e native

  web-assets:
    name: web assets (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
        # The page is a raw string inside a C++ header, so nothing compiled it and
        # a stray brace shipped twice: the dashboard then loads, dies on the first
        # parse error and leaves the owner stuck. Both files are extracted exactly
        # as the firmware serves them.
        - name: Syntax-check the shipped JavaScript and CSS
          run: |
          python3 tools/check_web_assets.py

    integration-syntax:
      name: Home Assistant integration
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
          python-version: "3.12"
      - name: Byte-compile the custom component
        run: python -m compileall -q custom_components/lilygo_power
      - name: Validate the JSON files
        run: |
          for f in custom_components/lilygo_power/manifest.json custom_components/lilygo_power/strings.json \
                   custom_components/lilygo_power/translations/*.json hacs.json; do
            python -m json.tool "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done

  firmware:
    name: firmware images (t3s3)
    runs-on: ubuntu-latest
    needs: host-tests
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gen_version.py stamps the commit into the firmware
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/boards/*.json') }}
      - name: Install PlatformIO and esptool
        run: pip install --upgrade platformio "esptool>=5,<6"

      # The tag is the release version, and it must agree with the VERSION file
      # so that a source build of the same commit reports the same version.
      # Untagged builds are marked as development builds.
      - name: Work out the version
        id: version
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$base" ]]; then
              echo "::error::Tag v$tag does not match VERSION ($base). Bump VERSION, commit, then tag."
              exit 1
            fi
            version="$tag"
          else
            version="$base-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Build the one image both boards run
        working-directory: firmware
        env:
          FW_VERSION: ${{ steps.version.outputs.version }}
        run: pio run -e t3s3

      - name: Package the release files
        run: python tools/make_release.py --version "${{ steps.version.outputs.version }}" --out dist

      - name: Summary
        run: |
          {
            echo "### Firmware ${{ steps.version.outputs.version }}"
            echo
            echo '| File | Use |'
            echo '|---|---|'
            echo "| \`lilygo-power-*-update.bin\` | Update over WiFi: web page → System → Firmware-Update |"
            echo "| \`lilygo-power-*-factory.bin\` | First install over USB with esptool at 0x0 (erases settings) |"
            echo "| \`manifest.json\` + \`parts/\` | Browser flasher (ESP Web Tools) |"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [firmware, integration-syntax]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-${{ needs.firmware.outputs.version }}
          path: dist
      - name: Bundle the browser-flasher parts
        run: cd dist && zip -r "lilygo-power-${{ needs.firmware.outputs.version }}-parts.zip" parts manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          name: Firmware ${{ needs.firmware.outputs.version }}
          generate_release_notes: true
          body: |
            **Which file do I need?**

            | File | When |
            |---|---|
            | `lilygo-power-${{ needs.firmware.outputs.version }}-update.bin` | **Updating** a board that already runs this firmware: its web page → *System* → *Firmware-Update*. Settings and pairing are kept. |
            | `lilygo-power-${{ needs.firmware.outputs.version }}-factory.bin` | **First install** over USB: `esptool --chip esp32s3 write-flash 0x0 <file>`. Erases all settings. |
            | Browser flasher | Easiest first install: open the project's GitHub Pages flasher in Chrome/Edge. |

            Update both boards to the same version. Full guide: [docs/FLASHING.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/FLASHING.md)
          files: |
            dist/lilygo-power-*-update.bin
            dist/lilygo-power-*-factory.bin
            dist/lilygo-power-*-parts.zip
            dist/SHA256SUMS

  flasher:
    name: deploy browser flasher (GitHub Pages)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [firmware, release]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-${{ needs.firmware.outputs.version }}
          path: dist
      - name: Assemble the site
        run: |
          mkdir -p site
          cp docs/flasher/index.html site/
          cp -r dist/parts dist/manifest.json site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
